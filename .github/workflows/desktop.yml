name: Desktop (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch UI font (Readex Pro, OFL)
        shell: bash
        run: |
          mkdir -p desktop/renderer/fonts
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf" -o desktop/renderer/fonts/ReadexPro-Variable.ttf || echo "font download failed; system fallback will be used"
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build installer + portable
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-manager-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          generate_release_notes: true
