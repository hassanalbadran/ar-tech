name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Fetch UI font (Readex Pro, OFL)
        run: |
          mkdir -p android/app/src/main/assets/app/fonts
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf" -o android/app/src/main/assets/app/fonts/ReadexPro-Variable.ttf || echo "font download failed; system fallback"
      - name: Signing key (optional — without it the APK is debug-signed)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VER="${GITHUB_REF_NAME#v}"; [ "${GITHUB_REF_TYPE}" = "tag" ] || VER="0.0.${GITHUB_RUN_NUMBER}"
          gradle assembleRelease -PversionName="$VER" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "ClinicManager-$VER.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-manager-android
          path: android/ClinicManager-*.apk
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/ClinicManager-*.apk
          generate_release_notes: true
