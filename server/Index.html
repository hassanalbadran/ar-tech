.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.g4{flex-wrap:wrap;justify-content:flex-start;gap:6px}

mbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol><symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></symbol><symbol id="i-cross" viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol><symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/></symbol><symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol><symbol id="i-mri" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></symbol><symbol id="i-ct" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 7.5v9"/></symbol><symbol id="i-xray" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 7v10M9 9h6M9 12h6M9 15h6"/></symbol><symbol id="i-emg" viewBox="0 0 24 24"><path d="M2 12h4l2-5 3 10 3-8 2 3h6"/></symbol><symbol id="i-lab" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M8 15h8"/></symbol></defs></svg>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const E=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SC=()=>{try{return localStorage.getItem('cm_site')||''}catch(e){return ''}};
const rpc=(f,...a)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(r=>r==null?no(new Error('لم يصل رد من الخادم. تأكد من نشر إصدار جديد من التطبيق.')):ok(r)).withFailureHandler(e=>no(new Error((e&&e.message)||String(e)))).siteCall(f,a,SC()));
const M=n=>new Intl.NumberFormat('en-US').format(Math.round(n||0))+' د.ع';
const LOGO=$('link[rel=icon]').href;
const S={cfg:{rxTimings:{},tests:{},extraFees:{}},pts:[],bks:[],upc:[],evs:[],view:'sec',sel:null,draft:null,ctx:null,sr:[],seen:new Set(),dis:new Set(),lastEv:0,q:Promise.resolve(),tm:0,pin:'',paid:0,drugs:new Set(),rf:{}};
const A={},F={};
const cur=()=>S.pts.find(x=>x.rowNumber===S.sel)||(S.ext&&S.ext.rowNumber===S.sel?S.ext:null);
const lock=(b,on)=>{if(b)b.disabled=!!on};
const ss=t=>{const e=$('#ss');if(e)e.textContent=t};
const D=()=>$('#dg');
const role=()=>S.view==='doc'?'doctor':'secretary';

function toast(m,t){const T=$('#ts'),d=document.createElement('div');d.className='t '+(t||'g');d.innerHTML=`<span>${E(m)}</span><button class="x" aria-label="إغلاق"><svg class="ic"><use href="#i-x"/></svg></button>`;d.querySelector('button').onclick=()=>d.remove();T.append(d);try{T.hidePopover()}catch(e){}try{T.showPopover()}catch(e){}setTimeout(()=>d.remove(),t==='r'?9000:4500)}
function dlg(title,body,wide){const d=D();d.className=wide?'wide':'';d.innerHTML=`<div class="dh"><h3>${title}</h3><button class="x" data-a="cx" aria-label="إغلاق"><svg class="ic"><use href="#i-x"/></svg></button></div><div class="db">${body}</div>`;if(!d.open)d.showModal()}
function arm(b,fn){if(b.dataset.arm){clearTimeout(b._t);delete b.dataset.arm;b.innerHTML=b._h;return fn()}b._h=b.innerHTML;b.dataset.arm=1;b.textContent='تأكيد؟ اضغط مجدداً';b._t=setTimeout(()=>{delete b.dataset.arm;b.innerHTML=b._h},3000)}

const dl=c=>{if(!c)return '';if(c==='prn')return 'عند الحاجة';if(c==='until_review')return 'لحين المراجعة';const n=+String(c).slice(1);return n===1?'لمدة يوم':n===2?'لمدة يومين':n===30?'لمدة شهر':n<=10?`لمدة ${n} أيام`:`لمدة ${n} يوماً`};
const RXE={morning:'Morning',noon:'Noon',evening:'Evening',after_meal:'After meal',before_meal:'Before meal',after_breakfast:'After breakfast',after_lunch:'After lunch',after_dinner:'After dinner',before_breakfast:'Before breakfast',before_lunch:'Before lunch',before_dinner:'Before dinner',every_4h:'Every 4 h'};
const dlE=c=>{if(!c)return '';if(c==='prn')return 'PRN (as needed)';if(c==='until_review')return 'Until review';const n=+String(c).slice(1);return n===30?'for 1 month':n===1?'for 1 day':'for '+n+' days'};
const rxT=x=>{const u=x.unit||'',tm=x.timing==='other'?(x.timingNote||'Other'):x.timing==='every'?'Every '+(x.hours||'?')+' h':(RXE[x.timing]||'')+(x.timingNote?' ('+x.timingNote+')':'');return [[x.name,x.strength?x.strength+(u.length>3?' ':'')+u:'',x.form].filter(Boolean).join(' '),x.dose,tm,dlE(x.duration)].filter(Boolean).join(' · ')};
const payChip=p=>p.consultationPaid==='مستورد'?'<i class="ch">سجل مستورد</i>':p.refunded?'<i class="ch r">مسترد</i>':p.isFreeVisit==='نعم'?'<i class="ch g">مجانية</i>':'<i class="ch y">كشفية مدفوعة</i>';
const stChip=p=>({closed:'<i class="ch">مغلق</i>',finished:'<i class="ch d">منتهي</i>',postponed:'<i class="ch o">مؤجل</i>'})[p.visitStatus]||'';

/* ---------- secretary ---------- */
function rSec(){
 $('#cnt').textContent=S.pts.length;$('#bc').textContent=S.bks.length;rUpc();
 $('#pts').innerHTML=S.pts.length?S.pts.map((p,i)=>`<div class="cd ${p.visitStatus==='finished'?'fn':''} ${S.seen.has(p.rowNumber)?'':'in'}" style="--i:${i}" data-a="prof" data-id="${E(p.patientId)}"><div class="row"><b>${E(p.fullName)}</b>${payChip(p)}</div><small>${E(agT(p.age))} · ${E(p.gender||'—')}</small><a class="ph" href="tel:${E(p.phone)}" onclick="event.stopPropagation()"><svg class="ic"><use href="#i-phone"/></svg> ${E(p.phone||'—')}</a><div class="row g4">${stChip(p)}${(p.tests||[]).map(t=>`<i class="ch">${E(t)}</i>`).join('')}<button class="ib" style="width:36px;height:36px;font-size:16px;margin-inline-start:auto" data-a="srx" data-r="${p.rowNumber}" title="إضافة علاج" aria-label="إضافة علاج"><svg class="ic"><use href="#i-rx"/></svg></button></div></div>`).join(''):'<div class="em" style="grid-column:1/-1"><div class="big"><svg class="ic"><use href="#i-calendar"/></svg></div>لا توجد زيارات اليوم. اضغط «مراجع جديد» للبدء.</div>';
 S.pts.forEach(p=>S.seen.add(p.rowNumber));
 $('#bks').innerHTML=S.bks.length?S.bks.map(b=>`<div class="cd ${b.status==='ملغى'?'gone':''}"><div class="row"><b>${E(b.patientName)}</b><i class="ch ${b.status==='حضر'?'g':b.status==='Pending'?'y':'r'}">${b.status==='Pending'?'انتظار':E(b.status)}</i></div><small><svg class="ic"><use href="#i-clock"/></svg> ${E(b.requestedSlot)} · ${E(String(b.callTime).slice(11,16))}</small><a class="ph" href="tel:${E(b.phone)}"><svg class="ic"><use href="#i-phone"/></svg> ${E(b.phone)}</a><div class="acts">${[['حضر','<svg class="ic"><use href="#i-check"/></svg>'],['لم يحضر','<svg class="ic"><use href="#i-x"/></svg>'],['تم الحجز','<svg class="ic"><use href="#i-pin"/></svg>'],['ملغى','<svg class="ic"><use href="#i-trash"/></svg>']].map(([s,i])=>`<button class="ib" title="${s}" aria-label="${s}" data-a="bs" data-id="${E(b.bookingId)}" data-s="${s}">${i}</button>`).join('')}</div></div>`).join(''):'<div class="em" style="grid-column:1/-1">لا توجد حجوزات لليوم.</div>';
 $('#al').innerHTML=S.evs.filter(e=>!S.dis.has(e.id)).map(e=>`<div class="al ${E(e.severity)}"><span>${e.severity==='danger'?'<svg class="ic"><use href="#i-undo"/></svg>':e.severity==='warning'?'<svg class="ic"><use href="#i-clock"/></svg>':'<svg class="ic"><use href="#i-wallet"/></svg>'} ${E(e.message)}</span><button class="x" data-a="dis" data-id="${e.id}" aria-label="إغلاق"><svg class="ic"><use href="#i-x"/></svg></button></div>`).join('');
}

const T12=t=>{const[h,m]=String(t).split(':').map(Number);return ((h%12)||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'ص':'م')};
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const dayLbl=(d,first)=>{const x=new Date(d+'T12:00:00');return (first?'اليوم':WD[x.getDay()])+' · '+x.getDate()+'/'+(x.getMonth()+1)};
function rUpc(){const u=(S.upc||[]).filter(b=>b.status!=='ملغى'),h=$('#uh'),c=$('#ubks');if(!h)return;h.hidden=!u.length;$('#uc').textContent=u.length;
 let last='';c.innerHTML=u.map(b=>{const d=b.callDate||String(b.callTime).slice(0,10),sl=String(b.requestedSlot||''),head=d!==last?(last=d,`<div class="ugd">${E(dayLbl(d))}</div>`):'';
  return head+`<div class="cd"><div class="row"><b>${E(b.patientName)}</b><i class="ch y">${E(sl)}</i></div><a class="ph" href="tel:${E(b.phone)}"><svg class="ic"><use href="#i-phone"/></svg> ${E(b.phone)}</a><div class="acts"><button class="ib" title="إلغاء الحجز" aria-label="إلغاء الحجز" data-a="bs" data-id="${E(b.bookingId)}" data-s="ملغى"><svg class="ic"><use href="#i-trash"/></svg></button></div></div>`}).join('')}

/* ---------- doctor ---------- */
function rQ(){
 $('#qc').textContent=S.pts.length;
 $('#qu').innerHTML=S.pts.length?S.pts.map((p,i)=>{const f=p.visitStatus==='finished';return `<div class="q ${p.rowNumber===S.sel?'on':''} ${f?'fn':''}" data-a="${f?'reo':'pick'}" data-i="${i}"><span class="n">${i+1}</span><div><b>${E(p.fullName)}</b><small>${E(agT(p.age))}</small></div>${stChip(p)}${f?'<span title="فتح للتعديل"><svg class="ic"><use href="#i-pencil"/></svg></span>':''}</div>`}).join(''):'<div class="em">لا يوجد مرضى اليوم</div>';
}
function rPanel(){
 const p=cur(),d=S.draft,el=$('#pn');
 if(!p||!d){el.innerHTML=hello();return}
 el.innerHTML=(S.ext&&S.ext.rowNumber===p.rowNumber?'<div class="al info"><span>عرض سجل سابق — لا يُحتسب كزيارة جديدة، وأي تعديل يُحفظ على آخر زيارة للمريض</span></div>':'')+`<div class="ph2"><div><h2>${E(p.fullName)}</h2><small>${E(agT(p.age))} · ${E(p.gender||'—')}</small></div><div class="row g4"><span id="ss" class="ss"></span><span id="pc">${payChip(p)}</span><button class="ib" data-a="prof" data-id="${E(p.patientId)}" title="ملف المريض" aria-label="ملف المريض"><svg class="ic"><use href="#i-file"/></svg></button><button class="ib" data-a="sur" title="عملية جراحية" aria-label="عملية جراحية"><svg class="ic"><use href="#i-cross"/></svg></button></div></div>
<label>التشخيص السابق</label><div class="prev" id="pv">—</div>
<label>التشخيص الحالي</label><textarea class="in" data-f="diagnosis" rows="3" placeholder="اكتب التشخيص">${E(d.diagnosis)}</textarea>
<label>الفحوصات المطلوبة</label><div class="tests">${Object.entries(S.cfg.tests||{}).map(([k,l])=>`<button class="tt ${d.tests.includes(k)?'on':''}" data-a="tst" data-k="${E(k)}" title="${E(l)}">${ic(TI[k]||'pulse')}<b>${k}</b><small>${E(l)}</small></button>`).join('')}</div>
<label>الروشيتة <button class="mini" id="cp" data-a="cpy" hidden><svg class="ic"><use href="#i-copy"/></svg> نسخ آخر وصفة</button></label><div id="rx"></div><div class="prev" id="lr" hidden style="margin-top:10px"></div>
<label>ملاحظات</label><textarea class="in" data-f="notes" rows="2" placeholder="ملاحظات">${E(d.notes)}</textarea>
<label>أجور إضافية <small style="display:inline">(تُسجَّل عند الإغلاق أو الانتهاء)</small></label><div class="row g4" id="fe"></div>
<div class="bar2"><button class="btn r" id="fr" data-a="free">FREE <svg class="ic"><use href="#i-undo"/></svg></button><button class="btn" data-a="act" data-x="close"><svg class="ic"><use href="#i-lock"/></svg> إغلاق</button><button class="btn g" data-a="act" data-x="finish"><svg class="ic"><use href="#i-ok"/></svg> انتهاء</button><button class="btn o" data-a="act" data-x="postpone"><svg class="ic"><use href="#i-clock"/></svg> تأجيل</button></div>`;
 rRx();rFee();rPrev();
}
function rRx(){const d=S.draft;if(!d||!$('#rx'))return;$('#rx').innerHTML=`<div class="rxg">${d.rx.map((x,i)=>`<div class="ri"><span dir="ltr">${E(rxT(x))}</span><button class="x" data-a="rxd" data-i="${i}" title="حذف" aria-label="حذف"><svg class="ic"><use href="#i-trash"/></svg></button></div>`).join('')}<button class="add" data-a="rxn" aria-label="إضافة دواء"><svg class="ic"><use href="#i-plus"/></svg><small>إضافة دواء</small></button></div>`}
function rFee(){const d=S.draft,p=cur();if(!d||!p||!$('#fe'))return;$('#fe').innerHTML=Object.entries(S.cfg.extraFees||{}).map(([k,f])=>`<button class="fee ${d.extra.includes(k)?'on':''}" data-a="fee" data-k="${E(k)}"><svg class="ic"><use href="#i-wallet"/></svg> ${E(f.label)} · ${M(f.amount)}</button>`).join('');$('#fr').disabled=p.consultationPaid!=='نعم'||!!(S.ext&&S.ext.rowNumber===p.rowNumber)}
function rPrev(){const c=S.ctx,el=$('#pv');if(!el)return;const t=c&&c.previousDiagnosis;el.innerHTML=t&&t.text?`${E(t.text)}<small>${E(t.visitDate)}</small>`:'لا يوجد تشخيص سابق';const b=$('#cp');if(b)b.hidden=!(c&&c.lastPrescriptions&&c.lastPrescriptions.items.length);const lp=c&&c.lastPrescriptions,lr=$('#lr');if(lr){const ok=!!(lp&&lp.items.length);lr.hidden=!ok;if(ok)lr.innerHTML='<small>آخر وصفة · '+E(lp.visitDate)+'</small>'+lp.items.map(x=>'<div dir="ltr" style="text-align:left">'+E(rxT(x))+'</div>').join('')}}

function openP(p){S.sel=p.rowNumber;S.draft={rowNumber:p.rowNumber,patientId:p.patientId,visitDate:p.visitDate,diagnosis:p.diagnosis||'',notes:p.notes||'',tests:[...(p.tests||[])],rx:(p.prescriptions||[]).map(x=>({...x})),extra:[...(p.extraCharges||[])]};S.ctx=null;S.rxK=(p.prescriptions||[]).map(x=>({...x}));(p.prescriptions||[]).forEach(x=>S.drugs.add(x.name));rQ();rPanel();window.scrollTo({top:0,behavior:'smooth'})}

 for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}else if(h==='"')q=true;else if(h===d){r.push(c);c=''}else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=h}

<div class="tw"><table><tr><th>الجهاز المربوط</th><th>المنصة</th><th>آخر ظهور</th><th></th></tr>${r.paired.map(d=>`<tr><td>${E(d.name)}</td><td>${E(d.platform)}</td><td><small>${E(d.seen||'—')}</small></td><td>${d.revoked?'ملغى':`<button class="btn r" data-a="apr" data-id="${E(d.id)}">فصل</button>`}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد أجهزة مربوطة</td></tr>'}</table></div></div>`,true)}
F.ak=async f=>{const b=f.querySelector('.btn');lock(b,1);try{const o=Object.fromEntries(new FormData(f)),r=await rpc('adminCreateLicense',S.ap,o);await admShow();$('#nk').innerHTML=`<div class="cfm" style="margin-top:12px">المفتاح الجديد: <code>${E(r.key)}</code></div>`;toast('أُنشئ المفتاح','g')}catch(e){toast(e.message,'r');lock(b,0)}};
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset&&t.dataset.a==='aus'){try{await rpc('adminUpdateLicense',S.ap,{key:t.dataset.k,usage:t.value});toast('حُدّث التصنيف','g')}catch(er){toast(er.message,'r')}}});
A.arv=b=>arm(b,async()=>{try{await rpc('adminUpdateLicense',S.ap,{key:b.dataset.k,status:b.dataset.s});await admShow()}catch(e){toast(e.message,'r')}});
A.adb=b=>arm(b,async()=>{try{await rpc('adminBlockDevice',S.ap,b.dataset.id,b.dataset.b==='1');await admShow()}catch(e){toast(e.message,'r')}});
A.apr=b=>arm(b,async()=>{try{await rpc('adminRevokePairedDevice',S.ap,b.dataset.id);await admShow()}catch(e){toast(e.message,'r')}});
A.apc=async b=>{lock(b,1);try{const r=await rpc('adminCreatePairingCode',S.ap);$('#pc2').innerHTML=`<div class="cfm">رمز الربط: <code style="font-size:20px">${E(r.code)}</code><br><small>الرابط: <code>${E(r.url)}</code></small><br><small>نص QR: <code>cm1|${E(r.url)}|${E(r.code)}</code></small></div>`}catch(e){toast(e.message,'r')}lock(b,0)};

/* ---------- data flow ---------- */
const setP=p=>{p=p||{};$('#d-sec').classList.toggle('live',!!p.secretaryActive);$('#d-doc').classList.toggle('live',!!p.doctorActive)};
const beat=()=>rpc('heartbeatPresence',role()).then(setP).catch(()=>{});
function snap(r,first){S.pts=r.patients||r.todayPatients||[];S.bks=r.bookings||r.todayBookings||[];S.upc=r.upcoming||r.todayUpcoming||[];S.evs=r.events||[];setP(r.presence);
 const mx=Math.max(0,...S.evs.map(e=>e.id));if(!first&&S.view==='sec')S.evs.filter(e=>e.id>S.lastEv).forEach(e=>toast(e.message,e.severity==='danger'?'r':'o'));S.lastEv=Math.max(S.lastEv,mx);
 if(r.today)$('#dt').textContent=r.today+' · جراحة الجملة العصبية';
 rSec();rQ();if(S.sel&&!cur()){S.sel=null;S.draft=null;rPanel()}else if(!S.sel)rPanel();if(S.draft&&!S.tm&&!S.sv){const sp=S.pts.find(x=>x.rowNumber===S.sel);if(sp)absorb(sp)}}
async function poll(force){if(S.polling)return;S.polling=1;try{const r=await rpc('getChangeRev');if(force||r!==S.rev||Date.now()-(S.fullAt||0)>120000){snap(await rpc('getTodayQueueSnapshot'));S.rev=r;S.fullAt=Date.now()}}catch(e){}S.polling=0}
let lastAct=Date.now(),pollN=0;['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{lastAct=Date.now()},{passive:true}));
const fatal=m=>{$('#fx').innerHTML=`<p class="err">${E(m)}</p><button class="btn g" onclick="location.reload()">إعادة المحاولة</button>`};
const askSite=m=>{$('#fx').innerHTML=`<p class="err">${m==='SITE_TEMP_LOCK'?'محاولات خاطئة كثيرة. انتظر بضع دقائق ثم أعد المحاولة.':m==='SITE_BADCODE'?'رمز الدخول غير صحيح.':'هذا التطبيق محمي. أدخل رمز الدخول الذي أعطاك إياه المسؤول.'}</p><input class="in" id="scd" type="password" autocomplete="off" style="max-width:260px;text-align:center;margin:10px auto"><br><button class="btn g" id="scb">دخول</button>`;
 const go=()=>{try{localStorage.setItem('cm_site',$('#scd').value.trim())}catch(e){}location.reload()};$('#scb').onclick=go;$('#scd').onkeydown=e=>{if(e.key==='Enter')go()}};
async function boot(){
 $$('.lg').forEach(i=>i.src=LOGO);
 try{const r=await rpc('systemInitialCheck');S.cfg=Object.assign(S.cfg,r.config||{});
  for(const c of r.checks||[]){$('#ck').insertAdjacentHTML('beforeend',`<li class="${c.ok?'ok':c.level==='critical'?'bad':'wr'}"><i>${c.ok?'<svg class="ic"><use href="#i-check"/></svg>':c.level==='critical'?'<svg class="ic"><use href="#i-x"/></svg>':'!'}</i><span>${E(c.label)}<small>${E(c.detail)}</small></span></li>`);await sleep(120)}
  if(!r.success)return fatal(r.error||'فشل فحص النظام.');
  if(!r.ready)return fatal('النظام موقوف حالياً من قبل المسؤول.');
  await sleep(500);snap(r,true);rPanel();
  $('#hd').hidden=false;$('#mn').hidden=false;$('#sp').classList.add('out');setTimeout(()=>$('#sp').remove(),600);
  if(r.warnings&&r.warnings.length)toast(r.warnings[0],'o');
  beat();setInterval(()=>{if(!document.hidden)beat()},25000);setInterval(()=>{if(document.hidden)return;if(Date.now()-lastAct>180000&&(++pollN%4))return;poll()},8000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){poll(true);beat()}});
  addEventListener('pagehide',()=>{try{google.script.run.siteCall('setPresenceOffline',[role()],SC())}catch(e){}});
 }catch(e){/^SITE_/.test(e.message)?askSite(e.message):fatal(e.message)}
}
boot();
</script>
</body>
</html>
